name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew --no-daemon --stacktrace build

      - name: Render the default sheet
        run: ./gradlew --no-daemon -q run --args="--plain"

      - name: Render other sizes and stocks
        run: |
          ./gradlew --no-daemon -q run --args="--size A3 --gsm 250 --plain"
          ./gradlew --no-daemon -q run --args="--stock newsprint --landscape --kg 3 --plain"
          ./gradlew --no-daemon -q run --args="--stock recycled --count 250 --plain --width 60"

      - name: Upload the runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: paper-lib
          path: build/libs/paper-lib-*-all.jar
          if-no-files-found: error